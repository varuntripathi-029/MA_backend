services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mxrating
      POSTGRES_PASSWORD: mxrating
      POSTGRES_DB: mxrating
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  postgres_data:
