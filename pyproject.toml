[project]
name = "mx-rating-backend"
version = "0.1.0"
description = "MX_rating backend: crawl, extract, score, and report on AI-agent readiness of a website"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "playwright>=1.48",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pydantic>=2.6",
    "groq>=0.13",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One shared event loop for the whole test session — test_engine (session-
# scoped, holds an asyncpg connection pool) would otherwise be created in
# one test's loop and reused (invalidly) from another's.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
